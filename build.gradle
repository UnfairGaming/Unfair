plugins {
    id 'application'
    id 'java'
}

group = 'net.minecraft'
version = '1.0.0'

base {
    archivesName = 'Unfair-MCP'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java.srcDirs = []
        resources.srcDirs = []
    }
}

def lombokVersion = '1.18.46'
def fastutilVersion = '8.5.19'

// 创建一个可解析的配置来专门处理LWJGL库
configurations {
    localRuntime {
        canBeResolved = true
        canBeConsumed = false
    }

    lwjglRuntime {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom implementation
    }
}

dependencies {
    // 这些库只用于编译，不打包进JAR
    localRuntime fileTree(dir: 'libs/minecraft', include: ['*.jar'])
    localRuntime fileTree(dir: 'libs/client', include: ['*.jar'], exclude: ['lombok-*.jar'])
    compileOnly fileTree(dir: 'libs/minecraft', include: ['*.jar'])
    compileOnly fileTree(dir: 'libs/client', include: ['*.jar'], exclude: ['lombok-*.jar'])
    compileOnly fileTree(dir: 'libs/client', include: ['lombok-*.jar'])

    // 只有LWJGL会被打包进JAR
    implementation fileTree(dir: 'libs/lwjgl', include: ['*.jar'])

    annotationProcessor fileTree(dir: 'libs/client', include: ['lombok-*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

application {
    mainClass = 'Start'
}

tasks.named('run', JavaExec) {
    workingDir = layout.projectDirectory.dir('run').asFile
    classpath += configurations.localRuntime
    jvmArgs '-Xmx2G'
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }

    // 只打包代码和LWJGL库
    from {
        // 包含编译后的class文件
        sourceSets.main.output
        // 只包含LWJGL库（通过lwjglRuntime配置解析）
        configurations.lwjglRuntime.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('verifyLocalLibraries') {
    group = 'verification'
    description = 'Checks that the required local library directories are populated.'

    doLast {
        def requiredFiles = [
                "libs/client/lombok-${lombokVersion}.jar",
                "libs/client/fastutil-${fastutilVersion}.jar"
        ]
        def missingFiles = requiredFiles.findAll { !file(it).isFile() }

        if (!missingFiles.isEmpty()) {
            throw new GradleException(
                    "Missing local libraries:\n - ${missingFiles.join('\n - ')}\n" +
                            "Restore the checked-in files under libs/."
            )
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'verifyLocalLibraries'
}
