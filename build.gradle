import org.apache.commons.lang3.SystemUtils

plugins {
    id 'idea'
    id 'java'
    id 'gg.essential.loom' version '0.10.0.+'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

def baseGroup = project.property('baseGroup')
def mcVersion = project.property('mcVersion')
def modid = project.property('modid')
def jarName = project.property('jarName')
def transformerFile = file('src/main/resources/accesstransformer.cfg')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

loom {
    log4jConfigs.from(file('log4j2.xml'))
    launchConfigs {
        client {
            property 'mixin.debug', 'true'
            arg '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'
        }
    }
    runConfigs {
        client {
            if (SystemUtils.IS_OS_MAC_OSX) {
                vmArgs.remove('-XstartOnFirstThread')
            }
        }
        remove(getByName('server'))
    }
    forge {
        pack200Provider.set(new dev.architectury.pack200.java.Pack200Adapter())
        mixinConfig "mixins.${modid}.json".toString()
        if (transformerFile.exists()) {
            println 'Installing access transformer'
            accessTransformer(transformerFile)
        }
    }
    mixin {
        defaultRefmapName.set("mixins.${modid}.refmap.json".toString())
    }
}

sourceSets {
    main {
        output.resourcesDir = java.classesDirectory.get().asFile
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1' }
}

configurations {
    shadowImpl
    implementation.extendsFrom(shadowImpl)
}

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings 'de.oceanlabs.mcp:mcp_stable:22-1.8.9'
    forge 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'
    shadowImpl('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        transitive = false
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT'
    runtimeOnly 'me.djtheredstoner:DevAuth-forge-legacy:1.2.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    archiveBaseName.set(jarName)
    manifest {
        attributes(
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod'             : 'true',
                'TweakClass'                 : 'org.spongepowered.asm.launch.MixinTweaker',
                'MixinConfigs'               : "mixins.${modid}.json".toString()
        )
        if (transformerFile.exists()) {
            attributes('FMLAT': "${modid}_at.cfg".toString())
        }
    }
}

tasks.processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', mcVersion
    inputs.property 'modid', modid
    inputs.property 'basePackage', baseGroup
    filesMatching(['mcmod.info', "mixins.${modid}.json".toString(), 'version.json']) {
        expand inputs.properties
    }
    rename 'accesstransformer.cfg', "META-INF/${modid}_at.cfg".toString()
}

tasks.named('remapJar') {
    archiveClassifier.set('')
    from tasks.named('shadowJar')
    input.set(tasks.named('shadowJar').flatMap { it.archiveFile })
}

tasks.jar {
    archiveClassifier.set('without-deps')
    destinationDirectory.set(layout.buildDirectory.dir('intermediates'))
}

tasks.shadowJar {
    destinationDirectory.set(layout.buildDirectory.dir('intermediates'))
    archiveClassifier.set('non-obfuscated-with-deps')
    configurations = [project.configurations.shadowImpl]
    doLast {
        configurations.each {
            println "Copying dependencies into mod: ${it.files}"
        }
    }
}

tasks.assemble.dependsOn(tasks.remapJar)
